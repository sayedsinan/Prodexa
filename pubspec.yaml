name: task_management_app
description: A comprehensive Flutter task management application with clean architecture, offline support, and modern UI.

# Prevent publishing to pub.dev
publish_to: 'none'

# App version
version: 1.0.0+1

# Flutter SDK constraints
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

# Runtime dependencies
dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.6

  # State Management
  get: ^4.6.6

  # HTTP & Network
  dio: ^5.3.4
  connectivity_plus: ^5.0.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2



  # UI & Animations
  flutter_animate: ^4.2.0+1
  lottie: ^2.7.0

  # Utils
  logger: ^2.0.2+1
  equatable: ^2.0.5

  # Form Validation
  form_builder_validators: ^11.2.0

# Development dependencies
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.1
  very_good_analysis: ^5.1.0

  # Code Generation
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

  # Testing
  mockito: ^5.4.4
  network_image_mock: ^2.1.1

# Flutter configuration
flutter:
  uses-material-design: true

  # Assets
  # assets:
    # - assets/images/
    # - assets/animations/
    # - assets/icons/

  # Custom fonts
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Light.ttf
  #         weight: 300
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/Poppins-ExtraBold.ttf
  #         weight: 800

# Additional configuration
dependency_overrides:
  # Override any conflicting dependencies if needed

# Platform specific configurations
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

# Build configurations
targets:
  $default:
    builders:
      hive_generator|hive_generator:
        generate_for:
          - lib/domain/models/*.dart